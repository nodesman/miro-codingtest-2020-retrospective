<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo for emails-input Component</title>
    <link href="emails-input.css" type="text/css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px 20px 20px;
            font-family: "Open Sans", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fafaf9;
            color: #1f2328;
        }

        .demo-shell {
            max-width: 982px;
            margin: 0 auto;
        }

        .secondary-forms {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .instance-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #57606a;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .instances-note {
            font-size: 12.5px;
            line-height: 1.45;
            color: #57606a;
            margin: 12px 0 10px;
        }

        input[type=button] {
            background-color: #4262ff;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            padding: 8px 14px;
            font-family: "Open Sans", sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin: 2px 8px 0 0;
            transition: background-color 0.15s ease;
        }

        input[type=button]:hover {
            background-color: #314ed9;
        }

        .main-form {
            margin: 0;
            background: #ffffff;
            border: 1px solid #e3e3df;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 16px 20px;
            width: 100%;
            border-radius: 8px;
            min-width: 0;
        }

        .emails-input {
            min-width: 0 !important;
            width: 100%;
        }

        @media only screen and (max-width: 680px) {
            body {
                padding: 14px 10px 18px;
            }

            .secondary-forms {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .main-form {
                padding: 14px;
            }

            input[type=button] {
                padding: 8px 13px;
                font-size: 12.5px;
            }
        }
    </style>
    <script src="emails-input.js"></script>
</head>
<body>

<div class="demo-shell">
    <form class="main-form">
        <div class="instance-label">Box 1 &middot; Primary Invite Field</div>
        <div class="emails-input-element"></div>
        <input type="button" class="add-email-button" value="Add email"/>
        <input type="button" class="get-count-button" value="Get emails count"/>
    </form>

    <p class="instances-note">Two more independent boxes on the same page&mdash;each keeps its own list and event listeners:</p>

    <div class="secondary-forms">
        <form class="main-form">
            <div class="instance-label">Box 2 &middot; Independent Field</div>
            <div class="emails-input-element"></div>
            <input type="button" class="add-email-button" value="Add email"/>
            <input type="button" class="get-count-button" value="Get emails count"/>
        </form>

        <form class="main-form">
            <div class="instance-label">Box 3 &middot; Independent Field</div>
            <div class="emails-input-element"></div>
            <input type="button" class="add-email-button" value="Add email"/>
            <input type="button" class="get-count-button" value="Get emails count"/>
        </form>
    </div>
</div>

<script>
  (function () {
    var demoApp = {
      _initializeButtonEvents: function (self) {
        window.addEventListener('DOMContentLoaded', function () {
          var forms = document.querySelectorAll('.main-form')
          for (var iter = 0; iter < forms.length; iter++) {
            var form = forms[iter]
            var add_email = form.querySelector('.add-email-button')
            var get_count = form.querySelector('.get-count-button')

            var hostElement = form.querySelector('.emails-input-element')

            var emailsInputInstance = new EmailsInput(hostElement, {
              placeholder: "Add more teammates ..."
            })

            add_email.addEventListener('click', self._addRandomEmail.bind(add_email, emailsInputInstance))
            get_count.addEventListener('click', self._getCount.bind(get_count, emailsInputInstance))
          }
        })
      },
      init: function () {
        var self = this
        this._initializeButtonEvents(self)
        var host = document.querySelector('#host')
      },
      _addRandomEmail: function (instance) {
        var time = (new Date()).getTime()
        time = Math.ceil(time / 1000)
        var handle = 'random' + time
        var domain = 'gmail.com'
        var email = handle + '@' + domain
        instance.addEmail(email)
      },
      _getCount: function (instance) {
        var emails = instance.getEmails()
        alert('This instance has ' + emails.length + ' count.')
      }
    }
    demoApp.init()
  })()

</script>

</body>
</html>
