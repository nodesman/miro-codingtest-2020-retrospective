<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo for emails-input Component</title>
    <link href="emails-input.css" type="text/css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 16px 28px;
            font-family: "Open Sans", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fafaf9;
            color: #1f2328;
        }

        input[type=button] {
            background-color: #4262ff;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            padding: 9px 16px;
            font-family: "Open Sans", sans-serif;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            margin: 6px 8px 0 0;
            transition: background-color 0.15s ease;
        }

        input[type=button]:hover {
            background-color: #314ed9;
        }

        .main-form {
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e3e3df;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 22px 24px;
            width: 100%;
            max-width: 720px;
            border-radius: 8px;
        }

        .emails-input {
            min-width: 0 !important;
            width: 100%;
        }

        p[align="center"] {
            font-size: 13px;
            line-height: 1.5;
            color: #57606a;
            max-width: 600px;
            margin: 18px auto 14px;
            padding: 0 8px;
        }

        @media only screen and (max-width: 600px) {
            body {
                padding: 14px 10px 20px;
            }

            .main-form {
                padding: 16px;
            }

            input[type=button] {
                padding: 9px 14px;
                font-size: 13px;
            }
        }
    </style>
    <script src="emails-input.js"></script>
</head>
<body>

<form class="main-form">
    <div class="emails-input-element"></div>
    <input type="button" class="add-email-button" value="Add email"/>
    <input type="button" class="get-count-button" value="Get emails count"/>
</form>

<p align="center">Here is another instance to show that you can use more than one instance independently of each
    other.</p>

<form class="main-form">
    <div class="emails-input-element"></div>
    <input type="button" class="add-email-button" value="Add email"/>
    <input type="button" class="get-count-button" value="Get emails count"/>
</form>

<p align="center">Here is another one:</p>

<form class="main-form">
    <div class="emails-input-element"></div>
    <input type="button" class="add-email-button" value="Add email"/>
    <input type="button" class="get-count-button" value="Get emails count"/>
</form>

<script>
  (function () {
    var demoApp = {
      _initializeButtonEvents: function (self) {
        window.addEventListener('DOMContentLoaded', function () {
          var forms = document.querySelectorAll('.main-form')
          for (var iter = 0; iter < forms.length; iter++) {
            var form = forms[iter]
            var add_email = form.querySelector('.add-email-button')
            var get_count = form.querySelector('.get-count-button')

            var hostElement = form.querySelector('.emails-input-element')

            var emailsInputInstance = new EmailsInput(hostElement, {
              placeholder: "Add more teammates ..."
            })

            add_email.addEventListener('click', self._addRandomEmail.bind(add_email, emailsInputInstance))
            get_count.addEventListener('click', self._getCount.bind(get_count, emailsInputInstance))
          }
        })
      },
      init: function () {
        var self = this
        this._initializeButtonEvents(self)
        var host = document.querySelector('#host')
      },
      _addRandomEmail: function (instance) {
        var time = (new Date()).getTime()
        time = Math.ceil(time / 1000)
        var handle = 'random' + time
        var domain = 'gmail.com'
        var email = handle + '@' + domain
        instance.addEmail(email)
      },
      _getCount: function (instance) {
        var emails = instance.getEmails()
        alert('This instance has ' + emails.length + ' count.')
      }
    }
    demoApp.init()
  })()

</script>

</body>
</html>
