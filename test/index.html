<!DOCTYPE html>
<html>
  <head>
    <title>Mocha</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mocha.css" />
    <style>
      body {
        background: #ffffff;
        margin: 0;
      }
      #mocha {
        margin: 0;
        padding: 18px 28px 20px;
      }
      #mocha > ul > .suite > h1 {
        margin-top: 0;
      }
      #mocha-stats {
        top: 14px;
        right: 20px;
      }
      @media (max-width: 640px) {
        #mocha {
          margin: 0;
          padding: 14px 14px 18px;
        }
        #mocha-stats {
          position: static;
          margin-bottom: 12px;
          font-size: 11px;
        }
        #mocha ul, #mocha li {
          margin-left: 0;
          padding-left: 8px;
        }
        #mocha .suite {
          margin-left: 8px;
        }
      }
    </style>
    <script src="../src/emails-input.js"></script>
  </head>
  <body>
    <div id="mocha"></div>
    <script src="mocha.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.2.0/chai.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chai-spies@1.0.0/chai-spies.min.js"></script>
    <script>mocha.setup('bdd');</script>
    <script src="emailsInputTest.spec.js"></script>
    <script>
      mocha.run();
    </script>
  </body>
</html>
